name: Backend CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      POLICY_FRONTEND_DIRECTORY: ${{ github.workspace }}/.ci/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify toolchain and Docker test support
        run: |
          ./mvnw --version
          docker info --format '{{.ServerVersion}}'
          docker compose version
      - name: Java and PostgreSQL regression tests
        run: ./mvnw -B -Pdatabase-tests verify
      - name: Python tests and production topology
        run: |
          python3 -B -m unittest discover -s scripts/tests -v
          python3 -B scripts/verify_production_compose.py --frontend-directory "$POLICY_FRONTEND_DIRECTORY"
      - name: Build production backend image without running it
        run: docker build --file deploy/backend/Dockerfile --tag policy-investigator-backend:ci .

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ThierryTe/ai-policy-invetigator'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      component: backend

  deploy:
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-production.yml
    with:
      component: backend
      source_sha: ${{ github.sha }}
    secrets: inherit
