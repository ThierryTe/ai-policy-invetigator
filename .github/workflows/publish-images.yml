name: Publish CI-validated images
on:
  workflow_call:
    inputs:
      component:
        type: string
        required: true
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main' && ((inputs.component == 'backend' && github.repository == 'ThierryTe/ai-policy-invetigator') || (inputs.component == 'frontend' && github.repository == 'ThierryTe/ai-policy-invetigator-frontend'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the CI-validated application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Check out backend tooling from validated source or stable main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ThierryTe/ai-policy-invetigator
          ref: ${{ inputs.component == 'backend' && github.sha || 'main' }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build, publish full-SHA images and advance discovery channel
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/policy-registry
          COMPONENT: ${{ inputs.component }}
        run: |
          mkdir -m 700 "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          python3 -B tooling/scripts/publish_release_images.py "$COMPONENT" \
            --sha "$GITHUB_SHA" --context "$GITHUB_WORKSPACE/source" >> "$GITHUB_STEP_SUMMARY"
