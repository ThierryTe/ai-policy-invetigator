name: Publish CI-validated images
on:
  workflow_dispatch:
    inputs:
      component:
        description: Publish the backend and model-init images for this exact CI-validated main revision
        type: choice
        options: [backend]
        required: true
        default: backend
  workflow_call:
    inputs:
      component:
        type: string
        required: true
      tooling_sha:
        description: Frontend callers must pin this to the same full backend SHA as the reusable workflow reference
        type: string
        required: false
        default: ''
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main' && ((inputs.component == 'backend' && github.repository == 'ThierryTe/ai-policy-invetigator') || (github.event_name != 'workflow_dispatch' && inputs.component == 'frontend' && github.repository == 'ThierryTe/ai-policy-invetigator-frontend'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require an immutable publication tooling revision
        env:
          TOOLING_SHA: ${{ inputs.component == 'backend' && github.sha || inputs.tooling_sha }}
        run: |
          python3 - <<'PY'
          import os, re
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ.get('TOOLING_SHA', '')):
              raise SystemExit('FULL_PUBLICATION_TOOLING_SHA_REQUIRED')
          PY
      - name: Require successful backend CI for manual publication
        if: github.event_name == 'workflow_dispatch'
        # Read public CI evidence without expanding reusable callers' token permissions.
        # API errors, rate limits and missing evidence all stop publication.
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          revision = os.environ['GITHUB_SHA']
          repository = 'ThierryTe/ai-policy-invetigator'
          query = urllib.parse.urlencode({
              'branch': 'main', 'event': 'push', 'head_sha': revision,
              'status': 'success', 'per_page': 100,
          })
          url = f'https://api.github.com/repos/{repository}/actions/workflows/verify.yml/runs?{query}'
          request = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response)['workflow_runs']
          validated = any(
              run.get('head_sha') == revision
              and run.get('head_branch') == 'main'
              and run.get('event') == 'push'
              and run.get('path') == '.github/workflows/verify.yml'
              and run.get('status') == 'completed'
              and run.get('conclusion') == 'success'
              and (run.get('head_repository') or {}).get('full_name') == repository
              for run in runs
          )
          if not validated:
              raise SystemExit('SUCCESSFUL_BACKEND_CI_FOR_EXACT_SHA_REQUIRED')
          print(f'Backend CI validated immutable revision {revision}')
          PY
      - name: Check out the CI-validated application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Check out the pinned backend publication tooling
        id: tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ThierryTe/ai-policy-invetigator
          ref: ${{ inputs.component == 'backend' && github.sha || inputs.tooling_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build, publish full-SHA images and advance discovery channel
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/policy-registry
          COMPONENT: ${{ inputs.component }}
          PUBLICATION_TOOLING_SHA: ${{ steps.tooling.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          python3 -B tooling/scripts/publish_release_images.py "$COMPONENT" \
            --sha "$GITHUB_SHA" --context "$GITHUB_WORKSPACE/source" > "$RUNNER_TEMP/publication.json"
          cat "$RUNNER_TEMP/publication.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain publication identities without application or production secrets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-${{ inputs.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication.json
          if-no-files-found: error
          retention-days: 30
