name: Publish backend images manually
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-ghcr-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      POLICY_FRONTEND_DIRECTORY: ${{ github.workspace }}/.ci/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify approved source before publication
        run: |
          ./mvnw -B -Pdatabase-tests verify
          python3 -B -m unittest discover -s scripts/tests -v
          python3 -B scripts/verify_production_compose.py --frontend-directory "$POLICY_FRONTEND_DIRECTORY"
      - name: Build full-SHA image versions
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          docker build --file deploy/backend/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:sha-$GITHUB_SHA" .
          docker build --file deploy/embeddings/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image-model-init:sha-$GITHUB_SHA" .
      - name: Isolate registry authentication outside the workspace
        run: printf 'DOCKER_CONFIG=%s/policy-investigator-ghcr\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Authenticate to GHCR using the job token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish image versions
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image-model-init:sha-$GITHUB_SHA"
          printf 'Published `%s` and `%s`, tag `sha-%s`. Record their registry digests for deployment.\n' \
            "$image" "$image-model-init" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove registry authentication
        if: always()
        run: |
          if [[ "${DOCKER_CONFIG:-}" == "$RUNNER_TEMP/policy-investigator-ghcr" ]]; then
            docker logout ghcr.io
          fi
