name: Reviewed V8 production release
on:
  # Compatibility for existing callers; the deployment job refuses workflow_call.
  workflow_call:
    inputs:
      component:
        type: string
        required: true
      source_sha:
        type: string
        required: true
    secrets:
      VPS_HOST:
        required: false
      VPS_USERNAME:
        required: false
      VPS_SSH_KEY:
        required: false
      VPS_PORT:
        required: false
      VPS_DEPLOY_PATH:
        required: false
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [prepare-reviewed, deploy-reviewed, deploy, rollback]
        default: prepare-reviewed
      prepared_release:
        description: Retained release ID for deploy-reviewed; for activate-v8, the successful migration release ID, identical to expected_previous
        type: string
      backend_sha:
        description: Full backend source SHA for manual recovery
        type: string
      frontend_sha:
        description: Full frontend source SHA for manual recovery
        type: string
      rollback_release:
        description: Previously validated release ID for rollback
        type: string
      allow_migrations:
        description: Permit migration only in migrate-v8 phase
        type: boolean
        default: false
      phase:
        description: Separate migration and worker-reactivation approvals
        type: choice
        options: [migrate-v8, activate-v8]
        default: migrate-v8
      expected_previous:
        description: Actual approved last-successful release ID; for activate-v8, identical to prepared_release
        type: string
      approved_backend_digest:
        description: Reviewed linux/amd64 backend child manifest digest
        type: string
      evidence_ref:
        description: 'Change-record ID: 3-80 uppercase letters/digits/dot/dash/underscore, e.g. CHG-V8-20261031'
        type: string
      confirm_github_protection:
        description: I attest prod required reviewers/main-only protection is configured (not verified here)
        type: boolean
        default: false
      confirm_v7_preflight:
        description: Migration only (false for activation) - I attest target-specific V7 preflight passed; reference held in change record
        type: boolean
        default: false
      confirm_v7_backup:
        description: Migration only (false for activation) - I attest a checksum-verified V7 backup is retained privately
        type: boolean
        default: false
      confirm_isolated_restore:
        description: Migration only (false for activation) - I attest this exact backup restored and verified on an isolated target
        type: boolean
        default: false
      confirm_write_freeze:
        description: I attest a probe-compatible writer/delivery freeze is active
        type: boolean
        default: false
      confirm_image_qualification:
        description: I attest the approved image/build profile is qualified; SQL matching is not binary identity
        type: boolean
        default: false
      confirm_v8_acceptance:
        description: Activation only - I attest V8 data/access/quota verification passed
        type: boolean
        default: false
      confirm_worker_reactivation:
        description: Activation only - I approve queued work resuming and consuming Meta attempts
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
concurrency:
  group: ai-policy-investigator-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'ThierryTe/ai-policy-invetigator'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment:
      name: prod
      url: https://ai-policy.tewendelabs.com
    env:
      OPERATION: ${{ inputs.operation }}
      PREPARED_RELEASE: ${{ inputs.prepared_release }}
      VPS_ENV_FILE: /opt/ai-policy-investigator/.env.production
      BACKEND_SHA: ${{ inputs.backend_sha }}
      FRONTEND_SHA: ${{ inputs.frontend_sha }}
      ROLLBACK_RELEASE: ${{ inputs.rollback_release }}
      ALLOW_MIGRATIONS: ${{ inputs.allow_migrations }}
      RELEASE_PHASE: ${{ inputs.phase }}
      EXPECTED_PREVIOUS: ${{ inputs.expected_previous }}
      APPROVED_BACKEND_DIGEST: ${{ inputs.approved_backend_digest }}
      EVIDENCE_REF: ${{ inputs.evidence_ref }}
      RELEASE_OPERATOR: ${{ github.actor }}
      CONFIRM_GITHUB_PROTECTION: ${{ inputs.confirm_github_protection }}
      CONFIRM_V7_PREFLIGHT: ${{ inputs.confirm_v7_preflight }}
      CONFIRM_V7_BACKUP: ${{ inputs.confirm_v7_backup }}
      CONFIRM_ISOLATED_RESTORE: ${{ inputs.confirm_isolated_restore }}
      CONFIRM_WRITE_FREEZE: ${{ inputs.confirm_write_freeze }}
      CONFIRM_IMAGE_QUALIFICATION: ${{ inputs.confirm_image_qualification }}
      CONFIRM_V8_ACCEPTANCE: ${{ inputs.confirm_v8_acceptance }}
      CONFIRM_WORKER_REACTIVATION: ${{ inputs.confirm_worker_reactivation }}
    steps:
      - name: Check out versioned backend deployment tooling, including frontend calls
        id: tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ThierryTe/ai-policy-invetigator
          ref: ${{ github.repository == 'ThierryTe/ai-policy-invetigator' && github.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate explicit inputs before registry or SSH access
        if: inputs.operation == 'deploy' || inputs.operation == 'rollback'
        run: python3 -B scripts/validate_release_dispatch.py --event-file "$GITHUB_EVENT_PATH"
      - name: Validate reviewed preparation or migration approval
        if: inputs.operation == 'prepare-reviewed' || inputs.operation == 'deploy-reviewed'
        # Resolve prod variables at step scope, after the runner declares the environment.
        env:
          CONFIGURATION_SHA: ${{ steps.tooling.outputs.commit }}
          V7_DEMO_INVESTIGATION_ID: ${{ vars.V7_DEMO_INVESTIGATION_ID }}
          V7_BACKUP_DIR: ${{ vars.V7_BACKUP_DIR }}
          V7_RESTORE_START_TIMEOUT_SECONDS: ${{ vars.V7_RESTORE_START_TIMEOUT_SECONDS }}
        # Both Python calls read the same dispatch form directly, including booleans.
        run: python3 -B scripts/run_reviewed_release.py --validate-only --event-file "$GITHUB_EVENT_PATH"
      - name: Verify deployment tooling and production topology
        env:
          POLICY_FRONTEND_DIRECTORY: ${{ github.workspace }}/.ci/frontend
        run: |
          python3 -B -m unittest discover -s scripts/tests -v
          python3 -B scripts/verify_production_compose.py --frontend-directory .ci/frontend
      - name: Transfer exact images and deploy via existing VPS SSH account
        if: inputs.operation == 'deploy' || inputs.operation == 'rollback'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/policy-registry
          CONFIGURATION_SHA: ${{ steps.tooling.outputs.commit }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
          VPS_ENV_FILE: /opt/ai-policy-investigator/.env.production
        run: |
          mkdir -m 700 "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          if [[ "$OPERATION" != rollback ]]; then
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          fi
          # Read exactly the same dispatch form as the preflight validator.
          python3 -B scripts/run_production_deploy.py --event-file "$GITHUB_EVENT_PATH" --configuration-sha "$CONFIGURATION_SHA" --output "$RUNNER_TEMP/policy-releases" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare or deploy the retained approved image pair
        if: inputs.operation == 'prepare-reviewed' || inputs.operation == 'deploy-reviewed'
        env:
          V7_DEMO_INVESTIGATION_ID: ${{ vars.V7_DEMO_INVESTIGATION_ID }}
          V7_BACKUP_DIR: ${{ vars.V7_BACKUP_DIR }}
          V7_RESTORE_START_TIMEOUT_SECONDS: ${{ vars.V7_RESTORE_START_TIMEOUT_SECONDS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/policy-registry
          CONFIGURATION_SHA: ${{ steps.tooling.outputs.commit }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
        run: |
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          python3 -B scripts/run_reviewed_release.py --event-file "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/policy-releases" >> "$GITHUB_STEP_SUMMARY"
      - name: Report verification boundary
        if: always()
        run: |
          printf '%s\n' 'prepare-reviewed: approved digests retained; unchanged V7 preflight and backup SQL, snapshot dump and isolated restore are automated; production apps stay running. deploy-reviewed: explicit migration approval, stop only project apps, repeat frozen backup/restore, migrate with workers disabled, verify V8 and data conservation before success. Legacy deploy backup/restore inputs remain OPERATOR ATTESTATIONS. Edge/external writer freeze, GitHub protection and image qualification remain human approvals. Embedded SQL matching does not establish JAR binary identity. Worker reactivation requires a separate activate-v8 dispatch. No automatic database rollback is performed. Private dumps, fingerprints, logs and env files stay on the VPS.' >> "$GITHUB_STEP_SUMMARY"
