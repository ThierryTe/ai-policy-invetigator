# Applied after the existing base and production files. Never starts model-init.
services:
  postgres:
    image: ${POSTGRES_IMAGE_REF:?Use the existing PostgreSQL image}
    pull_policy: never
  model-init:
    profiles: [model-bootstrap]
  backend:
    image: ${BACKEND_IMAGE_REF:?Immutable CI image required}
    build: !reset null
    pull_policy: never
    environment:
      APP_WORKER_ENABLED: ${APP_WORKER_ENABLED:?Set explicitly in .env.production}
      APP_INVESTIGATION_WORKER_ENABLED: ${APP_INVESTIGATION_WORKER_ENABLED:?Set explicitly in .env.production}
      APP_WORKER_HEALTH_ENABLED: 'true'
      APP_MIGRATIONS_VALIDATE_ONLY: 'true'
    depends_on: !override
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '15', http://127.0.0.1:8080/actuator/health]
      timeout: 20s
      start_period: 120s
      interval: 10s
      retries: 12

volumes:
  investigator_data:
    external: true
    name: ai-policy-investigator_investigator_data
  embedding_models:
    external: true
    name: ai-policy-investigator_embedding_models
  native_cache:
    external: true
    name: ai-policy-investigator_native_cache

networks:
  default:
    external: true
    name: ai-policy-investigator_default
  application:
    external: true
    internal: !reset null
    name: ai-policy-investigator_application
  database:
    external: true
    internal: !reset null
    name: ai-policy-investigator_database
