# Application identity and environment-specific connection settings.
spring.application.name=ai-policy-investigator
app.environment=${APP_ENVIRONMENT:production}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5546/investigator}
spring.datasource.username=${APP_DB_USERNAME:investigator_app}
spring.datasource.password=${APP_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:6}
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5546/investigator}
spring.flyway.user=${OWNER_DB_USERNAME:investigator_owner}
spring.flyway.password=${OWNER_DB_PASSWORD}

# Authentication settings. Secret values are supplied externally, never committed.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:ai-policy-investigator}
app.jwt.audience=${JWT_AUDIENCE:policy-api}

# HTTP ingestion limits; the parser/domain also enforce their independent safety caps.
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:11MB}
app.worker.enabled=${APP_WORKER_ENABLED:true}
app.investigation.worker-enabled=${APP_INVESTIGATION_WORKER_ENABLED:true}
app.worker-health.enabled=${APP_WORKER_HEALTH_ENABLED:false}
app.migrations.validate-only=${APP_MIGRATIONS_VALIDATE_ONLY:false}
app.investigation.budget-seconds=${META_INVESTIGATION_BUDGET_SECONDS:240}

# Pinned local embedding implementation. Model files remain outside the repository.
spring.ai.model.embedding=transformers
app.embedding.revision=${EMBEDDING_REVISION}
spring.ai.embedding.transformer.onnx.model-uri=${EMBEDDING_MODEL_URI}
spring.ai.embedding.transformer.tokenizer.uri=${EMBEDDING_TOKENIZER_URI}
spring.ai.embedding.transformer.tokenizer.options.padding=true

# Verified Meta reasoning provider; independent of local embeddings.
meta.api.key=${MODEL_API_KEY:}
meta.model=${META_MODEL_ID:muse-spark-1.3}
meta.max-completion-tokens=${META_MAX_COMPLETION_TOKENS:4096}
meta.timeout-seconds=${META_TIMEOUT_SECONDS:30}
meta.max-retries=${META_MAX_RETRIES:2}
meta.concurrency=${META_CONCURRENCY:2}

# Fixed persistence/security invariants, not application tuning knobs.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Production-safe bootstrap. The local launcher explicitly sets SPRINGDOTENV_ENABLED=true.
springdotenv.enabled=false
springdotenv.ignore-if-missing=true
springdotenv.export-to-system-properties=false

# Explicit local opt-in; production independently denies documentation in security.
springdoc.api-docs.enabled=${LOCAL_OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${LOCAL_SWAGGER_UI_ENABLED:false}
springdoc.paths-to-match=/api/**
springdoc.packages-to-scan=com.tewendelabs.investigator.policy,com.tewendelabs.investigator.investigation,com.tewendelabs.investigator.security
springdoc.override-with-generic-response=false
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.validator-url=none
springdoc.swagger-ui.query-config-enabled=false
springdoc.swagger-ui.try-it-out-enabled=${SWAGGER_TRY_IT_OUT_ENABLED:false}
