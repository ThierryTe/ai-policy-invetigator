name: ai-policy-investigator-ui
services:
  frontend:
    build: .
    ports:
      - '127.0.0.1:18081:8080'
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://backend:8080}
    networks:
      - backend
    restart: unless-stopped
networks:
  backend:
    external: true
    name: ${BACKEND_NETWORK:-ai-policy-investigator_default}
